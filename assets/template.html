<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root {
  --paper: #F7F8FA; --panel: #FFFFFF; --ink: #1E2330; --muted: #5E6778; --rule: #DCE0E7; --soft: #EEF1F5;
  --claim: #2E4FB8; --claim-bg: #E3E9FB; --def: #0E7A6D; --def-bg: #D9F1EC;
  --ev: #A15C07; --ev-bg: #FBEBCF; --fig: #6A3FB0; --fig-bg: #ECE3FA;
  --math: #B42318; --math-bg: #FCE4E1; --mech: #3F5A74; --mech-bg: #E3EBF3;
  --limit: #8B4A12; --flash: #FFF2B8; --scrim: rgba(20, 24, 32, 0.72);

  --serif: "Charter", "Iowan Old Style", "Palatino Linotype", "Noto Serif", "Source Han Serif SC", "Songti SC", Georgia, serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171A21; --panel: #1E222A; --ink: #E4E7ED; --muted: #A0A8B6; --rule: #333A46; --soft: #252A33;
    --claim: #9BB0FF; --claim-bg: #26314F; --def: #5FD0BF; --def-bg: #183531; --ev: #F0B35A; --ev-bg: #3D2E14;
    --fig: #C4A6FF; --fig-bg: #2E2645; --math: #FF8F84; --math-bg: #42201D; --mech: #A9C1D9; --mech-bg: #233040;
    --limit: #E3A36B; --flash: #4A4220; --scrim: rgba(0, 0, 0, 0.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171A21; --panel: #1E222A; --ink: #E4E7ED; --muted: #A0A8B6; --rule: #333A46; --soft: #252A33;
  --claim: #9BB0FF; --claim-bg: #26314F; --def: #5FD0BF; --def-bg: #183531; --ev: #F0B35A; --ev-bg: #3D2E14;
  --fig: #C4A6FF; --fig-bg: #2E2645; --math: #FF8F84; --math-bg: #42201D; --mech: #A9C1D9; --mech-bg: #233040;
  --limit: #E3A36B; --flash: #4A4220; --scrim: rgba(0, 0, 0, 0.8); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--sans); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--claim); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.top { padding: 30px 0 6px; }
.topline { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.title { font: 600 clamp(20px, 2.6vw, 26px)/1.3 var(--serif); margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
.langbtn { flex: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; }

.mapsec { padding: 22px 0 26px; }

.sw.dash { background: transparent; border: 0; border-bottom: 2px dashed var(--c); }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }

.part-h { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: baseline; }

.pt { font-weight: 650; font-size: 15.5px; }

.prole { color: var(--muted); font-size: 13px; }
.pclaim { text-align: left; background: var(--claim-bg); color: var(--ink); border: 0; border-left: 3px solid var(--claim); border-radius: 4px; padding: 6px 8px; font-weight: 600; font-size: 13.5px; line-height: 1.5; cursor: pointer; }
.chips { display: flex; flex-direction: column; gap: 3px; }

.chip:hover { background: var(--soft); }
.chip .ct { font-size: 11.5px; font-weight: 650; color: var(--c); white-space: nowrap; flex: 0 0 5.4em; }
.chip.lim { border: 1px dashed var(--limit); }
.map[hidden] { display: none; }
.lgraph { position: relative; margin: 4px 0 6px; }
.lrow { display: flex; justify-content: center; gap: 20px; margin: 0 0 58px; }
.lnode { position: relative; z-index: 1; flex: 0 1 250px; text-align: left; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 11px; cursor: pointer; font-size: 13px; line-height: 1.45; }
.lnode.root { flex-basis: 600px; border: 2px solid var(--claim); background: var(--claim-bg); font-size: 14.5px; }
.lnode .lt { display: flex; gap: 6px; align-items: baseline; font-weight: 650; font-size: 14px; margin-bottom: 3px; }
.lnode .lm { color: var(--muted); font-size: 11.5px; margin-top: 5px; }
.lnode .lrel { display: none; font-size: 12px; color: var(--muted); margin-top: 4px; }
.lnode .lrel b { color: var(--c); }
.lnode[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--claim); }
.lsvg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.edge { fill: none; stroke-width: 1.8; transition: opacity .15s; }
.r-supports { stroke: var(--claim); } .r-explains { stroke: var(--mech); } .r-qualifies { stroke: var(--limit); stroke-dasharray: 6 4; }
.r-extends { stroke: var(--def); } .r-frames { stroke: var(--muted); stroke-dasharray: 2 4; } .r-challenges { stroke: var(--math); } .r-answers { stroke: var(--def); }
.elabel { position: absolute; z-index: 2; transform: translate(-50%, -50%); background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; transition: opacity .15s; }
.elabel b { color: var(--c); font-weight: 700; margin-right: 5px; }
.dim { opacity: 0.15; }
.flow { border-top: 1px solid var(--rule); padding-top: 14px; }
.flow h3 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.flow h3 span { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.fsteps { display: flex; align-items: stretch; overflow-x: auto; padding-bottom: 6px; }
.fstep { flex: 0 0 190px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; font-size: 13px; line-height: 1.45; text-align: left; cursor: pointer; }
.fstep .fid { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.farrow { flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: var(--c); text-align: center; }
.farrow::after { content: ""; width: 56px; margin-top: 4px; border-top: 2px solid currentColor; }
.lgraph.list .lrow { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 10px; }
.lgraph.list .lnode { flex-basis: auto; }
.lgraph.list .lnode .lrel { display: block; }
.lgraph.list .lsvg, .lgraph.list .elabel { display: none; }
.skipnote { margin-top: 12px; font-size: 13px; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--claim); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 32px; align-items: start; border-top: 1px solid var(--rule); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto; padding: 14px 0 30px; }
.side > summary { display: none; }
.stabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.stabs button { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 13px; color: var(--muted); }
.stabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.olist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.ogroup { margin: 10px 0 4px; font-weight: 650; display: flex; gap: 6px; align-items: baseline; }
.ogroup .pn { width: 18px; height: 18px; font-size: 11px; }
.orow { display: flex; gap: 7px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 2px 4px; border-radius: 4px; cursor: pointer; line-height: 1.45; }
.orow:hover { background: var(--soft); }
.orow[aria-current="true"] { background: var(--soft); box-shadow: inset 2px 0 0 var(--claim); }
.orow .oid { color: var(--muted); font-size: 12px; flex: 0 0 2.6em; }
.tdot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--claim); transform: translateY(-1px); }
.tdot.close { background: var(--claim); }
.tdot.skip { border-color: var(--rule); border-style: dashed; }
.sitem { padding: 6px 4px; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.sitem .tag { font-size: 11px; font-weight: 700; color: var(--c); margin-right: 6px; }
.sitem .term { font-weight: 700; display: block; }
.sitem code { font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.sgroup { margin: 12px 0 2px; font-size: 12.5px; color: var(--muted); font-weight: 650; }
.reader { min-width: 0; max-width: 720px; padding-bottom: 80px; }
#progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--claim); z-index: 30; transition: width .1s linear; }
.brief { margin: 12px 0 0; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); font-size: 13.5px; max-width: 60em; }
.brief .bl { color: var(--muted); margin: 0 0 2px; } .brief .bq { margin: 6px 0 0; }
.brief .bq > b:first-child { display: block; } .brief .bq .linkbtn { margin-left: 6px; }
body.v-gist figure.crop, body.v-gist .figcard, body.v-gist .formula details.fx { display: none; }
.term { border-bottom: 1px dotted var(--def); cursor: help; position: relative; }
.term:hover::after, .term:focus::after { content: attr(data-def); position: absolute; left: 0; top: 1.5em; z-index: 6; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; font: 13px/1.45 var(--sans); min-width: 180px; max-width: 320px; white-space: normal; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.recall { margin: 10px 0 16px; padding: 8px 12px; border: 1px dashed var(--rule); border-radius: 6px; font-size: 14px; }
.recall > summary { cursor: pointer; font-weight: 600; } .recall ol { margin: 8px 0 0; padding-left: 20px; } .recall li { margin: 6px 0; }
.recall details { margin-top: 3px; } .recall details > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); } .recall details p { margin: 4px 0 0; }
.formula details.fx > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.guessbtn { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; margin: 0 0 8px; }
.guessbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
body.guess .elabel:not(.revealed) .lt, body.guess .lrel:not(.revealed) .lt { display: none; }
body.guess .elabel:not(.revealed)::after, body.guess .lrel:not(.revealed)::after { content: "?"; color: var(--c); font-weight: 700; }
body.guess .elabel, body.guess .lrel { cursor: pointer; }
body.v-gist .t-close .readfor { margin-bottom: 2px; }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding: 10px 0 8px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.toolbar .legend { margin: 0; }
.phead { margin: 22px 0 10px; padding-top: 10px; border-top: 1px solid var(--rule); scroll-margin-top: 70px; }
.ahead.lv1 + .phead { border-top: 0; padding-top: 0; margin-top: 10px; }
.ptitle { font-size: 15.5px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ptitle .pn { width: 20px; height: 20px; font-size: 11.5px; }
.prange { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.pclaim2 { margin: 8px 0 0; background: var(--claim-bg); border-left: 3px solid var(--claim); border-radius: 4px; padding: 6px 10px; font-weight: 600; }
.ahead { font-family: var(--serif); font-weight: 650; color: var(--ink); margin: 40px 0 6px; scroll-margin-top: 70px; }
.ahead.lv1 { font-size: 23px; line-height: 1.3; padding-top: 12px; border-top: 2px solid var(--ink); }
.ahead.lv2 { font-size: 19px; }
.ahead.lv3, .ahead.lv4 { font-size: 16.5px; color: var(--muted); }
.para { margin: 12px 0 18px; padding: 2px 0 2px 14px; border-left: 1px solid var(--rule); scroll-margin-top: 70px; }
.para.t-close { border-left: 3px solid var(--claim); padding-left: 13px; }
.para.t-skip { border-left-style: dashed; }
.para.fn { margin-left: 18px; font-size: 14px; }
.ph { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.ph .pid { font-weight: 700; color: var(--ink); }
.ph .role { color: var(--ink); font-weight: 600; }
.ph .tier { margin-left: auto; }
.t-close .ph .tier { color: var(--claim); font-weight: 700; }
.mini { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.mini i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--c); border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; line-height: 1.5; }
.readfor { margin: 2px 0 6px; font-size: 13.5px; }
.readfor b { color: var(--claim); margin-right: 6px; }
.note { margin: 2px 0 6px; font-size: 14.5px; }
b.num { font-weight: 700; font-variant-numeric: tabular-nums; }
.why { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.formula { margin: 8px 0 4px; padding: 8px 10px; border-left: 3px solid var(--math); background: var(--math-bg); border-radius: 4px; }
.formula .katex-display { margin: 4px 0 8px; overflow-x: auto; }
.formula dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 13px; }
.formula dt { font-family: var(--serif); font-style: italic; } .formula dd { margin: 0; }
.crop { margin: 6px 0; } .crop img { max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; background: #fff; display: block; }
.crop .cap { font-size: 11.5px; color: var(--muted); margin: 2px 0 0; }
.orig { font: 16.5px/1.75 var(--serif); margin: 4px 0 2px; overflow-wrap: anywhere; hyphens: auto; }
.t-skim .orig, .t-skip .orig, .fn .orig { font-size: 15.5px; }
.ow > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); width: max-content; }
.gap { font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
.gap b { color: var(--ink); font-weight: 600; }
mark.hl { color: inherit; background: var(--b); border-bottom: 2px solid var(--c); padding: 0 1px; border-radius: 2px; }
mark.hl.f-limit { background: transparent; border-bottom: 2px dashed var(--c); }
mark.hl.f-plain { background: var(--soft); border-bottom: 0; }
.hb { font: 700 10px/1 var(--sans); color: var(--c); vertical-align: 0.35em; margin-right: 2px; }
.figcard { margin: 6px 0 18px 14px; border: 1px solid var(--rule); border-left: 3px solid var(--fig); border-radius: 6px; padding: 8px 12px; background: var(--panel); }
.figcard .cap { font: italic 14px/1.55 var(--serif); margin: 0 0 6px; }
.figcard img { max-width: 100%; height: auto; display: block; margin: 6px 0; border-radius: 3px; background: #fff; }
.figcard .src { font-size: 12px; color: var(--muted); }
.tbl { overflow-x: auto; margin: 6px 0; }
.tbl table { border-collapse: collapse; font-size: 13.5px; }
.tbl td { border-bottom: 1px solid var(--rule); padding: 4px 8px; vertical-align: top; }
.pagebtn { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 2px 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
body.v-close .para:not(.t-close), body.v-close .figcard, body.v-close .ahead { display: none; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.viewer.open { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.viewer .vbar { display: flex; gap: 12px; align-items: center; color: #fff; font-size: 13.5px; }
.viewer .vbar button { background: #fff; color: #1E2330; border: 0; border-radius: 5px; padding: 4px 12px; cursor: pointer; }
.viewer .vimg { overflow: auto; max-width: 100%; flex: 1; }
.viewer img { max-width: min(100%, 900px); height: auto; display: block; margin: 0 auto; background: #fff; }
.foot { color: var(--muted); font-size: 12.5px; padding: 24px 0 40px; border-top: 1px solid var(--rule); }
@media (max-width: 960px) {
  .layout { display: block; }
  .side { position: static; max-height: none; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .side > summary { display: block; cursor: pointer; font-weight: 650; padding: 6px 0; }
  .ph .tier { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--claim); } }
@media print { .toolbar, .side, .langbtn, .pagebtn { display: none; } .layout { display: block; } .para { break-inside: avoid; } }
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div class="topline"><div><h1 class="title" id="title"></h1><p class="meta" id="meta"></p></div>
    <button type="button" class="langbtn" id="langbtn" hidden></button></div>
  <p class="thesis" id="thesis"></p>
  <p class="overview" id="overview"></p>
  <div class="brief" id="brief" hidden></div>
</div></header>
<section class="mapsec"><div class="wrap">
  <h2 class="sec" id="mapTitle"></h2>
  <p class="hint" id="mapHint"></p>
  <div class="legend" id="legend1"></div>
  <div class="lgraph" id="lgraph"></div>
  <div class="flow" id="flow"></div>
  <div class="map" id="map" hidden></div>
  <p class="skipnote" id="skipnote"></p>
</div></section>
<div class="wrap layout">
  <details class="side" id="side" open>
    <summary id="sideSummary"></summary>
    <div class="stabs" id="stabs"></div>
    <div id="sidebody"></div>
  </details>
  <main class="reader">
    <div class="toolbar"><span class="seg" id="views"></span><div class="legend" id="legend2"></div></div>
    <div id="stream"></div>
  </main>
</div>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="vbar"><span id="vtitle"></span><button type="button" id="vclose"></button></div>
  <div class="vimg"><img id="vimg" alt=""></div>
</div>

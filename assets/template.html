<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root {
  --paper: #F7F8FA; --panel: #FFFFFF; --ink: #1E2330; --muted: #5E6778; --faint: #7C8494; --rule: #DCE0E7; --soft: #EEF1F5;
  --accent: #2E4FB8; --hl: #E3E9FB; --accent2: #0E7A6D; --line: #9AA3B2;
  --flash: #FFF2B8; --scrim: rgba(20, 24, 32, 0.72);
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC",
          "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  --serif: "Charter", "Iowan Old Style", "Palatino Linotype", "Noto Serif", "Source Han Serif SC", "Songti SC", Georgia, serif;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171A21; --panel: #1E222A; --ink: #E4E7ED; --muted: #A0A8B6; --faint: #868E9C; --rule: #333A46; --soft: #252A33;
    --accent: #9BB0FF; --hl: #2A3456; --accent2: #5FD0BF; --line: #6B7484;
    --flash: #4A4220; --scrim: rgba(0, 0, 0, 0.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171A21; --panel: #1E222A; --ink: #E4E7ED; --muted: #A0A8B6; --faint: #868E9C; --rule: #333A46; --soft: #252A33;
  --accent: #9BB0FF; --hl: #2A3456; --accent2: #5FD0BF; --line: #6B7484;
  --flash: #4A4220; --scrim: rgba(0, 0, 0, 0.8); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); }
button { font: inherit; color: inherit; }
b, strong, h1, h2, h3 { font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
.imath .katex { font-size: 1em; }
b.num { font-weight: 600; font-variant-numeric: tabular-nums; }
.pn { font: 600 11.5px/1 var(--sans); color: var(--paper); background: var(--muted); border-radius: 50%; width: 19px; height: 19px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.smallbtn { white-space: nowrap; flex: none; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
.smallbtn:hover { color: var(--ink); border-color: var(--muted); }
details > summary { cursor: pointer; }

/* header: title, source line, one-sentence conclusion, the reader's questions */
.top { padding: 24px 0 0; }
.topline { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.title { font: 600 clamp(22px, 2.4vw, 26px)/1.3 var(--serif); margin: 0; }
.meta { color: var(--muted); font-size: 14px; margin: 4px 0 10px; }
.thesis { font: 600 clamp(17px, 1.7vw, 19px)/1.55 var(--sans); margin: 0 0 6px; max-width: 58em; }
.qs { font-size: 14.5px; margin: 0 0 4px; max-width: 46em; }
.qs > summary { color: var(--accent); width: max-content; max-width: 100%; }
.qs .q { margin: 10px 0 2px; font-weight: 600; }
.qs .a { margin: 0; color: var(--ink); }
.qs .a .linkbtn { margin-left: 6px; font-size: 13px; }

/* mind map: conclusion left, parts in one column, a part's steps to the right */
.mapsec { padding: 14px 0 22px; }
.mm { position: relative; font-size: 14px; line-height: 1.4; }
.mm ul { list-style: none; margin: 0; padding: 0; }
.mm-lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mm-lines path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.mm-lines path.dash { stroke-dasharray: 5 4; }
.mm-root { display: block; width: 100%; text-align: left; background: var(--panel); border: 1.5px solid var(--accent); border-radius: 8px; padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 14.5px; line-height: 1.5; }
.mm-root:not(.full) .mm-rt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mm-row { display: flex; align-items: center; gap: 4px; }
.mm-node { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--rule); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
.mm-node:hover, .mm-step:hover, .mm-root:hover { border-color: var(--muted); }
.mm-node .mm-t { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mm-node[aria-expanded]::after { content: ""; flex: none; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; }
.mm-node[aria-expanded="true"] { border-color: var(--accent); }
.mm-node[aria-expanded="true"]::after { transform: rotate(45deg) translate(-2px, -2px); }
.mm-jump { flex: 0 0 2.8em; text-align: left; background: none; border: 0; padding: 4px 2px; color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
.mm-step { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 9px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.mm-step .sid { color: var(--muted); font-size: 12px; margin-right: 6px; }
.mm-guess { position: absolute; left: 0; bottom: 0; }
.mm.list .mm-guess { position: static; margin-top: 10px; }
.mm.list .mm-lines { display: none; }
.mm.list .mm-parts { margin: 10px 0 0 10px; padding-left: 12px; border-left: 1.5px solid var(--line); }
.mm.list .mm-part { margin: 6px 0; }
.mm.list .mm-part[data-rel="qualifies"] > .mm-row { border-left: 1.5px dashed var(--line); margin-left: -13.5px; padding-left: 12px; }
.mm.list .mm-steps { margin: 6px 0 4px 14px; padding-left: 12px; border-left: 1.5px solid var(--line); }
.mm.list .mm-stepli { margin: 4px 0; }
.mm.list .mm-stepli[data-rel="qualifies"] { border-left: 1.5px dashed var(--line); margin-left: -13.5px; padding-left: 12px; }
.mm.list .mm-step { white-space: normal; }
.mm.guess.list .mm-part > .mm-row, .mm.guess.list .mm-stepli { border-left-style: solid !important; }
.mm.guess.list .mm-part:not([data-rel="qualifies"]) > .mm-row, .mm.guess.list .mm-stepli:not([data-rel="qualifies"]) { border-left: 0; }

/* reading area */
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 40px; align-items: start; border-top: 1px solid var(--rule); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto; padding: 16px 0 30px; }
.toc { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.toc button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 5px 6px; border-radius: 4px; cursor: pointer; line-height: 1.4; color: var(--muted); }
.toc button:hover { background: var(--soft); color: var(--ink); }
.toc button[aria-current="true"] { color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); background: var(--soft); }
.toc .pn { width: 17px; height: 17px; font-size: 10.5px; transform: translateY(2px); }
.toc .nopn { flex: 0 0 17px; }
.reader { min-width: 0; max-width: calc(36em + 64px); padding: 0 0 80px 46px; font-size: 18px; }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); margin-left: -46px; padding: 10px 0 9px 46px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; }
.toolbar .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 12px; cursor: pointer; color: var(--muted); font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#tocbtn { display: none; }
#progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; transition: width .1s linear; }

.phead { margin: 40px 0 20px; scroll-margin-top: 60px; }
.phead:first-child { margin-top: 20px; }
.ptitle { font: 600 20px/1.35 var(--sans); margin: 0; display: flex; gap: 10px; align-items: baseline; }
.ptitle .pn { transform: translateY(-2px); }
.pclaim { margin: 6px 0 0; font-size: 17px; line-height: 1.6; color: var(--ink); }
.ahead { font: 600 16px/1.4 var(--serif); color: var(--muted); margin: 32px 0 14px; }
.para { position: relative; margin: 0 0 24px; padding: 0 0 0 16px; border-left: 1px solid var(--rule); scroll-margin-top: 64px; line-height: 1.75; }
.para.t-close { border-left: 3px solid var(--accent); padding-left: 14px; }
.para.t-skip { border-left: 0; padding-left: 17px; color: var(--faint); font-size: 16px; }
.para.fn { margin-left: 18px; font-size: 16px; }
.pid { position: absolute; right: 100%; margin-right: 12px; top: 0.3em; white-space: nowrap; font: 12px/1.5 var(--sans); color: var(--faint); }
.para.t-close .pid { margin-right: 14px; }
.readfor { margin: 0 0 8px; font-size: 15.5px; line-height: 1.65; color: var(--muted); }
.readfor b { color: var(--ink); margin-right: 8px; }
.note { margin: 0; }
.orig { font: 18px/1.75 var(--serif); margin: 4px 0 0; overflow-wrap: anywhere; hyphens: auto; }
.t-skip .orig, .fn .orig { font-size: 16px; }
.ow, .nd { margin: 6px 0 0; }
.ow > summary, .nd > summary, .fx > summary { font: 13px/1.6 var(--sans); color: var(--muted); width: max-content; max-width: 100%; }
.t-close > .ow > summary { display: none; }
body.v-gist .t-close > .ow > summary, .t-close > .ow:not([open]) > summary { display: list-item; }
.nd { margin-top: 12px; }
.nd .note { margin-top: 4px; }
body.v-gist .t-close > .readfor { display: none; }
body.v-gist .para.t-close { display: flex; flex-direction: column; }
body.v-gist .t-close > .nd { order: -1; margin: 0 0 4px; }
.skipd > summary { list-style: none; color: var(--faint); }
.skipd > summary::-webkit-details-marker { display: none; }
.skipd > summary::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 8px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg) translateY(-2px); }
.skipd[open] > summary::after { transform: rotate(45deg) translateY(-3px); }
.skipd[open] .orig { color: var(--ink); }
mark.hl { color: inherit; background: var(--hl); border-radius: 2px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.term { border-bottom: 1px dotted var(--accent2); cursor: help; position: relative; }
.term:hover::after, .term:focus::after { content: attr(data-def); position: absolute; left: 0; top: 1.6em; z-index: 6; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; font: 13.5px/1.5 var(--sans); min-width: 180px; max-width: 320px; white-space: normal; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.gap { font-size: 13px; color: var(--muted); margin: 4px 0; }
.gap b { color: var(--ink); }
.formula { margin: 12px 0 0; }
.formula .katex-display { margin: 6px 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.fx { margin: 2px 0 0; font-size: 16px; line-height: 1.65; }
.fx .note { margin: 8px 0 0; }
.fx dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0 0; }
.fx dt { font-family: var(--serif); font-style: italic; } .fx dd { margin: 0; }
.fx .why { margin: 8px 0 0; color: var(--muted); }
.crop { margin: 10px 0 0; } .crop img { max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; background: #fff; display: block; }
.crop .cap { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.tpage { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.figcard { margin: -8px 0 24px 16px; padding: 10px 0 0; font-size: 14px; }
.figcard .cap { font: italic 14px/1.55 var(--serif); margin: 0 0 8px; }
.figcard img { max-width: 100%; height: auto; display: block; margin: 6px 0; border-radius: 3px; background: #fff; }
.figcard .src { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.tbl { overflow-x: auto; margin: 6px 0; }
.tbl table { border-collapse: collapse; font-size: 13.5px; }
.tbl td { border-bottom: 1px solid var(--rule); padding: 4px 8px; vertical-align: top; }
.pagebtn { background: none; border: 1px solid var(--rule); border-radius: 5px; padding: 1px 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
body.v-gist .crop, body.v-gist .figcard, body.v-gist .fx { display: none; }
.recall { margin: 0 0 24px 16px; font-size: 16px; line-height: 1.65; }
.recall > summary { font-weight: 600; color: var(--muted); font-size: 14.5px; }
.recall ol { margin: 8px 0 0; padding-left: 22px; } .recall li { margin: 8px 0; }
.recall details { margin-top: 2px; } .recall details > summary { font-size: 13px; color: var(--muted); } .recall details p { margin: 4px 0 0; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }

/* look-up list of terms */
.lookup { width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 760px); border: 1px solid var(--rule); border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink); }
.lookup::backdrop { background: var(--scrim); }
.lkbar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.lkbar h2 { font-size: 16px; margin: 0; }
.lkbody { padding: 4px 16px 16px; font-size: 15px; line-height: 1.6; }
.lkgroup { margin: 14px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.lkitem { padding: 6px 0; border-bottom: 1px solid var(--rule); }
.lkitem .lkterm { font-weight: 600; display: block; }
.lkitem .linkbtn { margin-left: 6px; font-size: 13px; }

.viewer { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: none; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
.viewer.open { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.viewer .vbar { display: flex; gap: 12px; align-items: center; color: #fff; font-size: 13.5px; }
.viewer .vbar button { background: #fff; color: #1E2330; border: 0; border-radius: 5px; padding: 4px 12px; cursor: pointer; }
.viewer .vimg { overflow: auto; max-width: 100%; flex: 1; }
.viewer img { max-width: min(100%, 900px); height: auto; display: block; margin: 0 auto; background: #fff; }
.foot { color: var(--muted); font-size: 12.5px; padding: 24px 0 40px; border-top: 1px solid var(--rule); }
@media (max-width: 960px) {
  .layout { display: block; }
  .side { position: fixed; z-index: 15; top: 0; bottom: 0; left: 0; width: min(300px, 85vw); max-height: none; background: var(--panel); border-right: 1px solid var(--rule); padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px 30px; box-shadow: 0 0 24px rgba(0,0,0,.18); transform: translateX(-105%); visibility: hidden; transition: transform .2s, visibility .2s; }
  .side.open { transform: none; visibility: visible; }
  #tocbtn { display: inline-block; }
  .reader { max-width: none; }
}
@media (max-width: 720px) {
  .reader { padding-left: 0; font-size: 17px; }
  .toolbar { margin-left: 0; padding-left: 0; }
  .pid { position: static; float: left; margin-right: 8px; line-height: 1.75; top: 0; }
  .para.t-close .pid { margin-right: 8px; }
  .skipd .pid { float: none; }
  .figcard { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--accent); } .side, .mm-node::after { transition: none; } }
@media print {
  .toolbar, .side, .langbtn, .pagebtn, .mm-guess, .mm-jump, .lookup, #progress { display: none !important; }
  .layout { display: block; border: 0; } .reader { max-width: none; }
  .para { break-inside: avoid; } body { background: #fff; }
}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div class="topline"><h1 class="title" id="title"></h1>
    <button type="button" class="smallbtn langbtn" id="langbtn" hidden></button></div>
  <p class="meta" id="meta"></p>
  <p class="thesis" id="thesis"></p>
  <details class="qs" id="qs" hidden><summary id="qsum"></summary><div id="qbody"></div></details>
</div></header>
<section class="mapsec" id="mapsec"><div class="wrap"><div class="mm" id="mm"></div></div></section>
<div class="wrap layout">
  <nav class="side" id="side"><ol class="toc" id="toc"></ol></nav>
  <main class="reader">
    <div class="toolbar"><span class="seg" id="views"></span><span class="grow"></span>
      <button type="button" class="smallbtn" id="tocbtn" aria-controls="side" aria-expanded="false"></button>
      <button type="button" class="smallbtn" id="lkbtn" aria-haspopup="dialog"></button></div>
    <div id="stream"></div>
  </main>
</div>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<dialog class="lookup" id="lookup" aria-labelledby="lktitle">
  <div class="lkbar"><h2 id="lktitle"></h2><button type="button" class="smallbtn" id="lkclose"></button></div>
  <div class="lkbody" id="lkbody"></div>
</dialog>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="vbar"><span id="vtitle"></span><button type="button" id="vclose"></button></div>
  <div class="vimg"><img id="vimg" alt=""></div>
</div>

    var y = 0, rows = [], gapP = 7, gapS = 6;
    mm.querySelectorAll(".mm-part").forEach(function (li) {
      var row = li.querySelector(".mm-row"); place(row, x1, w1);
      var h = row.offsetHeight, steps = li.querySelector(".mm-steps"), sts = [], sh = 0;
      if (steps && !steps.hidden) steps.querySelectorAll(".mm-stepli").forEach(function (s) { place(s, x2, w2); var hh = s.offsetHeight; sts.push([s, hh]); sh += hh; });
      if (sts.length) sh += gapS * (sts.length - 1);
      var blk = Math.max(h, sh), ry = y + (blk - h) / 2, sy = y + (blk - sh) / 2;
      row.style.top = ry + "px";
      var sy0 = [];
      sts.forEach(function (s) { s[0].style.top = sy + "px"; sy0.push([sy + s[1] / 2, s[0].dataset.rel]); sy += s[1] + gapS; });
      rows.push({ c: ry + h / 2, rel: li.dataset.rel, steps: sy0 });
      y += blk + gapP + (sts.length ? 8 : 0);
    });
    var root = mm.querySelector(".mm-root"); place(root, 0, w0);
    var rh = root.offsetHeight, mid = rows.length ? (rows[0].c + rows[rows.length - 1].c) / 2 : rh / 2;
    var rt = Math.max(0, mid - rh / 2); root.style.top = rt + "px";
    var gb = mm.querySelector(".mm-guess"), need = rt + rh + 12 + gb.offsetHeight;
    mm.style.height = Math.max(y - gapP, need) + "px";
    var NS = "http://www.w3.org/2000/svg";
    function curve(xa, ya, xb, yb, rel) {
      var p = document.createElementNS(NS, "path"), mx = (xa + xb) / 2;
      p.setAttribute("d", "M" + xa + "," + ya + " C" + mx + "," + ya + " " + mx + "," + yb + " " + xb + "," + yb);
      if (rel === "qualifies" && !GUESS) p.setAttribute("class", "dash");
      svg.appendChild(p);
    }
    var rc = rt + rh / 2;
    rows.forEach(function (r) {
      curve(w0, rc, x1, r.c, r.rel);
      r.steps.forEach(function (s) { curve(x1 + w1, r.c, x2, s[0], s[1]); });
    });
  }

  function renderToc() {
    var toc = $("toc"); toc.textContent = "";
    D.parts.forEach(function (p) {
      var li = el("li"), b = btn(null, null, function () { setToc(false); jump(rangeIds(p.range)[0]); });
      b.dataset.part = p.id;
      b.appendChild(p.skip ? el("span", "nopn") : el("span", "pn", String(partNo(p))));
      withNums(b.appendChild(el("span")), L(p.title)); li.appendChild(b); toc.appendChild(li);
    });
  }
  function setToc(on) {
    var side = $("side"); if (!window.matchMedia("(max-width: 960px)").matches) on = false;
    side.classList.toggle("open", on); $("tocbtn").setAttribute("aria-expanded", on ? "true" : "false");
    if (on) { var f = side.querySelector('[aria-current="true"]') || side.querySelector("button"); if (f) f.focus(); }
  }
  $("tocbtn").addEventListener("click", function (e) { e.stopPropagation(); setToc(!$("side").classList.contains("open")); });
  document.addEventListener("click", function (e) { if ($("side").classList.contains("open") && !$("side").contains(e.target)) setToc(false); });

  function renderLookup() {
    var body = $("lkbody"), u = UI[LANG], any = false; body.textContent = "";
    D.parts.forEach(function (p) {
      var rows = ALL.filter(function (x) { return x.part === p && (x.e.t === "def" || x.e.t === "assumption"); });
      if (!rows.length) return; any = true;
      body.appendChild(withNums(el("div", "lkgroup"), L(p.title)));
      rows.forEach(function (x) {
        var d = el("div", "lkitem");
        if (x.e.term) withNums(d.appendChild(el("span", "lkterm")), L(x.e.term)); else d.appendChild(el("span", "lkterm", tname(x.e.t)));
        withNums(d, L(x.e.x) || L(x.e.s));
        d.appendChild(btn("linkbtn", idLabel(x.id), function () { $("lookup").close(); jump(x.id, x.i); }));
        body.appendChild(d);
      });
    });
    if (!any) body.appendChild(el("p", null, u.noTerms));
  }
  $("lkbtn").addEventListener("click", function () { var d = $("lookup"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); });
  $("lkclose").addEventListener("click", function () { $("lookup").close(); });
  $("lookup").addEventListener("click", function (e) { if (e.target === this) this.close(); });

  function recallNode(p) {
    var u = UI[LANG], det = el("details", "recall"), ol = el("ol");
    det.appendChild(el("summary", null, u.recall + (LANG === "zh" ? "（" + p.recall.length + "）" : " (" + p.recall.length + ")")));
    p.recall.forEach(function (q) {
      var li = el("li"); li.appendChild(withNums(el("span"), L(q.q)));
      var a = el("details"); a.appendChild(el("summary", null, u.answer)); a.appendChild(withNums(el("p"), L(q.a))); li.appendChild(a); ol.appendChild(li);
    });
    det.appendChild(ol); return det;
  }
  function renderStream() {
    var s = $("stream");
    s.textContent = "";
    var starts = {}, ends = {}; D.parts.forEach(function (p) { var ids = rangeIds(p.range); starts[ids[0]] = p; ends[ids[ids.length - 1]] = p; });
    D.order.forEach(function (id) {
      var it = D.items[id];
      if (it.type === "heading") { if (it.level > 0) s.appendChild(withMath(el("h3", "ahead"), it.text)); return; }
      if (it.type === "caption") { if (!(D.figs[id] && D.figs[id].host)) s.appendChild(figNode(id)); return; }
      if (it.type !== "para") return;
      var p = starts[id];
      if (p) {
        var hd = el("section", "phead"), t = el("h2", "ptitle"); hd.id = "part-" + p.id;
        if (!p.skip) t.appendChild(el("span", "pn", String(partNo(p))));
        withNums(t.appendChild(el("span")), L(p.title)); hd.appendChild(t);
        if (p.claim) hd.appendChild(withNums(el("p", "pclaim"), L(p.claim)));
        s.appendChild(hd);
      }
      s.appendChild(paraNode(id, false));
      (it.notes || []).forEach(function (nid) { s.appendChild(paraNode(nid, true)); });
      (hosted[id] || []).forEach(function (cid) { s.appendChild(figNode(cid)); });
      if (ends[id] && ends[id].recall && ends[id].recall.length) s.appendChild(recallNode(ends[id]));
    });
    watch();
  }
  var io = null;
  function watch() {
    if (!("IntersectionObserver" in window)) return;
    if (io) io.disconnect();
    var vis = {};
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) vis[e.target.id] = 1; else delete vis[e.target.id]; });
      var ids = Object.keys(vis).filter(function (x) { return x[0] === "P"; }).sort(function (a, b) { return pnum(a) - pnum(b); });
      var cur = ids.length ? partOf(ids[0]) : null;
      document.querySelectorAll(".toc button").forEach(function (r) { r.setAttribute("aria-current", cur && r.dataset.part === cur.id ? "true" : "false"); });
    }, { rootMargin: "-90px 0px -60% 0px" });
    document.querySelectorAll(".para").forEach(function (p) { io.observe(p); });
  }
  function setView(v) {
    VIEW = v;
    document.body.classList.toggle("v-gist", v === "gist");
    document.querySelectorAll("#views button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.v === v ? "true" : "false"); });
    document.querySelectorAll(".para.t-close").forEach(function (a) {
      var nd = a.querySelector(":scope > .nd"), ow = a.querySelector(":scope > .ow");
      if (ow) ow.open = v === "full" || !nd;
      if (nd) nd.open = v === "gist";
    });
  }
  function topVisible() {
    var tb = document.querySelector(".toolbar").getBoundingClientRect().bottom, best = null;
    document.querySelectorAll(".para").forEach(function (p) { if (!best && p.getBoundingClientRect().bottom > tb + 4) best = p.id; });
    return best;
  }
  $("langbtn").addEventListener("click", function () {
    var keep = window.pageYOffset > document.querySelector(".layout").offsetTop ? topVisible() : null;
    var offset = keep ? $(keep).getBoundingClientRect().top : 0;
    LANG = LANG === D.langs[0] ? D.langs[1] : D.langs[0];
    renderAll();
    if (keep) { var t = $(keep); window.scrollTo(0, t.getBoundingClientRect().top + window.pageYOffset - offset); }
  });
  var printState = null;
  window.addEventListener("beforeprint", function () {
    if (printState) return;
    printState = [];
    document.querySelectorAll("details.ow, details.nd").forEach(function (d) { printState.push([d, d.open]); d.open = true; });
  });
  window.addEventListener("afterprint", function () {
    if (!printState) return;
    printState.forEach(function (s) { s[0].open = s[1]; });
    printState = null;
  });
  var rt = null;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layoutMap, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMap);
  function progress() {
    var st = $("stream"), bar = $("progress"); if (!st || !bar) return;
    var top = st.getBoundingClientRect().top + window.pageYOffset, h = st.offsetHeight - window.innerHeight;
    var f = h > 0 ? (window.pageYOffset - top) / h : 1; bar.style.width = (Math.max(0, Math.min(1, f)) * 100) + "%";
  }
  window.addEventListener("scroll", progress, { passive: true }); window.addEventListener("resize", progress);
  function renderAll() { renderHeader(); renderMap(); renderToc(); renderLookup(); renderStream(); setView(VIEW); progress(); }
  renderAll();
})();
</script>
</body>

<style>
/* Layout after Hallmark (MIT, https://github.com/Nutlope/hallmark): Long Document, Editorial theme. System font stacks only, so the page works offline. */
:root {
  --color-paper: oklch(97% 0.007 86); --color-paper-2: oklch(94% 0.010 86); --color-paper-3: oklch(91% 0.012 84);

  --color-accent: oklch(49% 0.130 152); --color-accent-ink: oklch(98% 0.005 88); --color-focus: oklch(52% 0.135 152);
  --color-mark: oklch(90% 0.050 152 / 0.48); --color-flash: oklch(92% 0.060 152); --color-plate: oklch(99% 0.003 86);
  --color-scrim: oklch(18% 0.010 280 / 0.78); --color-on-scrim: oklch(96% 0.005 86);
  --font-display: "Avenir Next", "Seravek", "Bahnschrift", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
  --font-body: "Charter", "Iowan Old Style", "Palatino Linotype", "Book Antiqua", "Source Serif 4", "Noto Serif", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Microsoft YaHei", serif;
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px; --space-4xl: 144px;
  --text-xs: 13px; --text-sm: 14px; --text-md: 16px; --text-note: 17px; --text-read: 18px; --text-lead: 21px; --text-head: 22px; --text-title: clamp(28px, 2.9vw, 38px);
  --container: 1240px; --gutter: 40px; --margin-col: 20rem; --rule-hair: 1px; --rule-heavy: 4px; --bar-h: 49px;
  --dur-micro: 120ms; --dur-short: 220ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-paper: oklch(17% 0.008 86); --color-paper-2: oklch(20% 0.009 86); --color-paper-3: oklch(23% 0.010 84);
    --color-ink: oklch(93% 0.008 86); --color-ink-2: oklch(84% 0.008 86); --color-muted: oklch(70% 0.010 80);
    --color-rule: oklch(31% 0.010 80); --color-rule-2: oklch(48% 0.010 80);
    --color-accent: oklch(74% 0.110 152); --color-accent-ink: oklch(18% 0.010 152); --color-focus: oklch(76% 0.120 152);
    --color-mark: oklch(38% 0.060 152 / 0.65); --color-flash: oklch(34% 0.060 152); --color-plate: oklch(92% 0.004 86);

    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-paper: oklch(17% 0.008 86); --color-paper-2: oklch(20% 0.009 86); --color-paper-3: oklch(23% 0.010 84);

  --color-rule: oklch(31% 0.010 80); --color-rule-2: oklch(48% 0.010 80);
  --color-accent: oklch(74% 0.110 152); --color-accent-ink: oklch(18% 0.010 152); --color-focus: oklch(76% 0.120 152);
  --color-mark: oklch(38% 0.060 152 / 0.65); --color-flash: oklch(34% 0.060 152); --color-plate: oklch(92% 0.004 86);

}

/* inline maths: simple formulas are set as text in the face around them; KaTeX takes the rest at the text's own size and colour */

/* controls: text set in the label face, one filled state on the view switch */
.textbtn { background: none; border: 0; padding: var(--space-2xs) 0; font: 500 var(--text-sm)/1.4 var(--font-display); color: var(--color-ink-2);
  text-decoration: underline var(--rule-hair) var(--color-rule-2); text-underline-offset: 0.25em; cursor: pointer; white-space: nowrap;
  transition: text-decoration-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }

.linkbtn:hover { text-decoration-color: var(--color-accent); }

/* the masthead: title and source */
.mast { padding-block: var(--space-lg) var(--space-md); }
.mast-top { display: flex; gap: var(--space-lg); align-items: baseline; justify-content: space-between; }

.meta { margin: var(--space-sm) 0 0; font: 400 var(--text-sm)/1.5 var(--font-display); color: var(--color-muted); }

/* the map: the thesis on the left wired to the parts as rows, a part's steps open under it */
.mapsec { border-top: var(--rule-heavy) solid var(--color-ink); }
.mapgrid { position: relative; display: grid; grid-template-columns: minmax(0, var(--margin-col)) minmax(0, 1fr); column-gap: var(--space-2xl); padding-block: var(--space-lg) var(--space-xl); }
.mm-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.mm-lines path.dash { stroke-dasharray: 5 4; }
.lede { align-self: start; }

.qs:not([open]) { flex: 0 1 auto; order: 0; }
.qs > summary { font: 500 var(--text-sm)/1.5 var(--font-display); color: var(--color-ink-2); width: max-content; max-width: 100%; }
.qs .q { margin: var(--space-sm) 0 var(--space-3xs); font-weight: 600; color: var(--color-ink); }
.qs .a { margin: 0; color: var(--color-ink-2); }
.qs .a .linkbtn { margin-left: var(--space-xs); font: 500 var(--text-xs)/1.4 var(--font-display); }
.mm { min-width: 0; }
.mm ul { list-style: none; margin: 0; padding: 0; }
.mm-parts { border-top: var(--rule-hair) solid var(--color-rule-2); }
.mm-part { border-bottom: var(--rule-hair) solid var(--color-rule); }
.mm-row { display: flex; align-items: center; gap: var(--space-sm); min-height: 40px; }
.mm-node { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: var(--space-sm); text-align: left; background: none; border: 0; padding: var(--space-xs) 0; cursor: pointer;
  font: 500 var(--text-md)/1.4 var(--font-display); color: var(--color-ink); transition: color var(--dur-short) var(--ease-out); }
.mm-node:hover, .mm-step:hover { color: var(--color-accent); }
.mm-n { flex: none; min-width: 1.4em; font-variant-numeric: tabular-nums; color: var(--color-muted); }
.mm-t { flex: 1; min-width: 0; }
.mm-part.skip .mm-node { color: var(--color-muted); }
.mm-tog { flex: none; display: inline-flex; align-items: center; gap: var(--space-xs); min-height: 40px; padding: 0 0 0 var(--space-sm); background: none; border: 0; cursor: pointer;
  font: 400 var(--text-xs)/1 var(--font-display); color: var(--color-muted); font-variant-numeric: tabular-nums; }

  font: 400 var(--text-sm)/1.5 var(--font-body); color: var(--color-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--dur-short) var(--ease-out); }

/* the reading bar: back to the map, the two views, terms, and how far through the paper the reader is */
.bar { position: sticky; top: 0; z-index: 20; background: var(--color-paper); border-top: var(--rule-hair) solid var(--color-rule); }
.bar-in { display: flex; align-items: center; gap: var(--space-lg); min-height: var(--bar-h); }
.bar .grow { flex: 1; }
.seg { display: inline-flex; border: var(--rule-hair) solid var(--color-ink); }
.seg button { background: none; border: 0; padding: var(--space-2xs) var(--space-sm); min-height: 32px; cursor: pointer; font: 500 var(--text-sm)/1.2 var(--font-display); color: var(--color-ink-2); white-space: nowrap; }
.seg button + button { border-left: var(--rule-hair) solid var(--color-ink); }
.seg button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }
.progress { height: 2px; background: var(--color-rule); }
#progress { display: block; height: 100%; background: var(--color-accent); transform-origin: 0 50%; transform: scaleX(0); }

/* the reading: each part keeps its head in the margin while its paragraphs run in one measure */
.reading { padding-block: var(--space-xl) var(--space-3xl); }
.part { display: grid; grid-template-columns: minmax(0, var(--margin-col)) minmax(0, 1fr); column-gap: var(--space-2xl); padding-bottom: var(--space-xl); }

.ptitle .n { font-weight: 400; color: var(--color-muted); font-variant-numeric: tabular-nums; }
.pclaim { margin: var(--space-sm) 0 0; font: 400 var(--text-md)/1.6 var(--font-body); color: var(--color-ink-2); }

.para { position: relative; margin: 0 0 var(--space-lg); scroll-margin-top: calc(var(--bar-h) + var(--space-lg)); }

.t-close .pid { color: var(--color-ink); font-weight: 600; }
.para.fn { margin-left: var(--space-lg); }
.readfor { margin: 0 0 var(--space-sm); font: 400 var(--text-md)/1.65 var(--font-body); color: var(--color-ink-2); }
.readfor b { font-family: var(--font-display); font-weight: 600; font-size: var(--text-sm); color: var(--color-ink); margin-right: var(--space-xs); }
.note { margin: 0; font: 400 var(--text-note)/1.7 var(--font-body); color: var(--color-ink-2); }
.orig { margin: var(--space-2xs) 0 0; font: 400 var(--text-read)/1.75 var(--font-body); color: var(--color-ink); overflow-wrap: break-word; hyphens: auto; }
.t-skip .orig, .fn .orig { font-size: var(--text-md); }
.ow, .nd { margin: var(--space-xs) 0 0; }
.ow > summary, .nd > summary, .fx > summary, .recall details > summary { font: 500 var(--text-xs)/1.6 var(--font-display); color: var(--color-muted); width: max-content; max-width: 100%; }
.ow > summary:hover, .nd > summary:hover, .fx > summary:hover, .recall summary:hover, .qs > summary:hover { color: var(--color-ink); }
.t-close > .ow > summary { display: none; }
body.v-gist .t-close > .ow > summary, .t-close > .ow:not([open]) > summary { display: list-item; }
.nd { margin-top: var(--space-sm); }
.nd .note { margin-top: var(--space-2xs); }
body.v-gist .t-close > .readfor, body.v-gist .ahead { display: none; }
body.v-gist .para.t-close { display: flex; flex-direction: column; }
body.v-gist .t-close > .nd { order: -1; margin: 0 0 var(--space-2xs); }
body.v-gist .t-close > .nd > summary { display: none; }
.t-skip .skipd > summary { list-style: none; font: 400 var(--text-md)/1.6 var(--font-body); color: var(--color-muted); }
.skipd > summary::-webkit-details-marker { display: none; }
.skipd > summary::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: var(--space-xs); border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-3px) rotate(45deg); }
.skipd[open] > summary::after { transform: translateY(0) rotate(-135deg); }
.skipd > summary:hover { color: var(--color-ink-2); }
mark.hl { color: inherit; background: linear-gradient(to bottom, transparent 0.42em, var(--color-mark) 0.42em, var(--color-mark) 1.12em, transparent 1.12em); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.term { text-decoration: underline dotted var(--rule-hair) var(--color-rule-2); text-underline-offset: 0.22em; cursor: help; position: relative; }
.term::after { content: attr(data-def); position: absolute; left: 0; top: 1.7em; z-index: 25; width: max-content; max-width: min(320px, 80vw); padding: var(--space-xs) var(--space-sm);
  background: var(--color-paper); color: var(--color-ink); border: var(--rule-hair) solid var(--color-rule-2); font: 400 var(--text-sm)/1.5 var(--font-display); white-space: normal;
  opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--dur-micro) var(--ease-out) 0s, visibility 0s linear var(--dur-micro); }
.term:hover::after { opacity: 1; visibility: visible; transition: opacity var(--dur-micro) var(--ease-out) 0.8s, visibility 0s linear 0.8s; }
.term:focus::after { opacity: 1; visibility: visible; transition: none; }
.gap { font: 400 var(--text-xs)/1.5 var(--font-display); color: var(--color-muted); margin: var(--space-2xs) 0; }
.gap b { color: var(--color-ink); }
.formula { margin: var(--space-sm) 0 0; }
.formula .katex-display { margin: var(--space-xs) 0; overflow-x: auto; overflow-y: hidden; padding: var(--space-2xs) 0; }
.formula .katex { font-size: 1.08em; }
.fx { margin: 0; font-size: var(--text-md); line-height: 1.65; }
.fx .note { margin: var(--space-xs) 0 0; }
.fx dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2xs) var(--space-md); margin: var(--space-xs) 0 0; font-size: var(--text-md); }
.fx dt { color: var(--color-ink); } .fx dd { margin: 0; color: var(--color-ink-2); }
.fx .why { margin: var(--space-xs) 0 0; color: var(--color-ink-2); }
.fx .why b { font-family: var(--font-display); font-size: var(--text-sm); }
.crop { margin: var(--space-sm) 0 0; }
.crop img { max-width: 100%; display: block; background: var(--color-plate); outline: var(--rule-hair) solid var(--color-rule); outline-offset: -1px; }
.cap, .src, .tpage { font: 400 var(--text-xs)/1.5 var(--font-display); color: var(--color-muted); margin: var(--space-2xs) 0 0; }
.figcard { margin: 0 0 var(--space-lg); padding-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule); }
.figcard > .cap { font-size: var(--text-sm); color: var(--color-ink-2); margin: 0 0 var(--space-xs); }
.figcard img { max-width: 100%; height: auto; display: block; margin: var(--space-xs) 0; background: var(--color-plate); }
.tbl { overflow-x: auto; margin: var(--space-xs) 0; }
.tbl table { border-collapse: collapse; font: 400 var(--text-sm)/1.45 var(--font-display); font-variant-numeric: tabular-nums; }
.tbl td { border-bottom: var(--rule-hair) solid var(--color-rule); padding: var(--space-2xs) var(--space-xs); vertical-align: top; }
.pagebtn { background: none; border: 0; padding: 0; font: 500 var(--text-xs)/1.5 var(--font-display); color: var(--color-ink-2); text-decoration: underline var(--rule-hair) var(--color-rule-2); text-underline-offset: 0.2em; cursor: pointer; }
.pagebtn:hover { text-decoration-color: var(--color-accent); }
.pagebtn:active { color: var(--color-accent); }
body.v-gist .crop, body.v-gist .figcard, body.v-gist .fx { display: none; }
.recall { margin: var(--space-xl) 0 0; padding-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule-2); font-size: var(--text-md); line-height: 1.65; }
.recall > summary { font: 600 var(--text-sm)/1.5 var(--font-display); color: var(--color-ink); }
.recall ol { margin: var(--space-xs) 0 0; padding-left: var(--space-lg); } .recall li { margin: var(--space-xs) 0; color: var(--color-ink); }
.recall details { margin-top: var(--space-3xs); } .recall details p { margin: var(--space-2xs) 0 0; color: var(--color-ink-2); }
.flash { animation: flash 1.6s var(--ease-out); }
@keyframes flash { from { background: var(--color-flash); } to { background: transparent; } }

/* look-up list of terms */
.lookup[open] { display: flex; flex-direction: column; }
.lookup { width: min(560px, calc(100% - var(--space-xl))); max-height: min(80vh, 760px); border: var(--rule-hair) solid var(--color-ink); border-radius: 0; padding: 0; background: var(--color-paper); color: var(--color-ink); }
.lookup::backdrop { background: var(--color-scrim); }
.lkbar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--color-paper); border-bottom: var(--rule-hair) solid var(--color-rule); }
.lkbar h2 { font-size: var(--text-md); margin: 0; }
.lkbody { overflow: auto; padding: var(--space-2xs) var(--space-md) var(--space-md); font-size: var(--text-md); line-height: 1.6; }
.lkgroup { margin: var(--space-md) 0 var(--space-2xs); font: 600 var(--text-xs)/1.5 var(--font-display); color: var(--color-muted); }
.lkitem { padding: var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-rule); color: var(--color-ink-2); }
.lkitem .lkterm { font-weight: 600; display: block; color: var(--color-ink); }
.lkitem .linkbtn { margin-left: var(--space-xs); font: 500 var(--text-xs)/1.4 var(--font-display); }

.viewer { position: fixed; inset: 0; z-index: 40; background: var(--color-scrim); display: none; padding: calc(env(safe-area-inset-top, 0px) + var(--space-sm)) var(--space-sm) calc(env(safe-area-inset-bottom, 0px) + var(--space-sm)); }
.viewer.open { display: flex; flex-direction: column; align-items: center; gap: var(--space-xs); }
.viewer .vbar { display: flex; gap: var(--space-sm); align-items: center; color: var(--color-on-scrim); font: 400 var(--text-sm)/1.4 var(--font-display); }
.viewer .vbar button { background: none; color: var(--color-on-scrim); border: var(--rule-hair) solid var(--color-on-scrim); padding: var(--space-2xs) var(--space-sm); cursor: pointer; font: 500 var(--text-sm)/1.4 var(--font-display); }
.viewer .vimg { overflow: auto; max-width: 100%; flex: 1; }
